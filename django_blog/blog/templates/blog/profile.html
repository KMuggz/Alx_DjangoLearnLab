{% extends "blog/base.html" %}

{% block content %}
    <h2>User Profile</h2>
    <p>Username: {{ user.username }}</p>
    <p>Email: {{ user.email }}</p>

    <hr>
    <h3>Update Your Information</h3>
    <form method="POST">
        {% csrf_token %}
        {{ u_form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
