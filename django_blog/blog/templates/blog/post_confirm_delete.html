{% extends "blog/base.html" %}

{% block content %}
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete the post: <strong>"{{ object.title }}"</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white;">Confirm Delete</button>
        <a href="{% url 'post-detail' object.id %}">Cancel</a>
    </form>
{% endblock %}
