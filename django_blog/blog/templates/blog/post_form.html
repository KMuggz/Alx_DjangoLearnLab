{% extends "blog/base.html" %}

{% block content %}
    <h2>{% if object %} Update Post {% else %} New Post {% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Post</button>
    </form>
    <br>
    <a href="{% url 'post-list' %}">Cancel</a>
{% endblock %}
