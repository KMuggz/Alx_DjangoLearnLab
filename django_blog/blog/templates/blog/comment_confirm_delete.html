{% extends "blog/base.html" %}

{% block content %}
    <h2>Delete Comment</h2>
    <p>Are you sure you want to delete this comment?</p>
    
    <div style="border: 1px solid #ddd; padding: 10px; margin-bottom: 20px;">
        <p><strong>{{ object.author }}</strong>: {{ object.content|truncatewords:20 }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 10px 20px; cursor: pointer;">
            Confirm Delete
        </button>
        <a href="{% url 'post-detail' object.post.id %}" style="margin-left: 10px;">Cancel</a>
    </form>
{% endblock %}
